[project]
name = "personal-library"
version = "3.0.0"
description = "Imports PDFs into your e-book library, shows the gallery and exports."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jeferson Klaus" }]
dependencies = [
    # cli = the `flet run` command; desktop = the app window. Without them Flet tries
    # to install them on the first run (slow, and it fails with no internet).
    "flet[cli,desktop]>=1.0.5",
    "pypdf>=4.0",
    "pypdfium2",  # cover from the 1st page when importing
    "Pillow",     # gallery thumbnails
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

# `flet run` (with no arguments) runs the main.py of this folder (the code lives in src/).
[tool.flet]
product = "Personal Library"
org = "io.personallibrary"
company = "Jeferson Klaus"
copyright = "Copyright (c) 2026 Jeferson Klaus"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for `import src...`, "tests" for `import helpers` from the test folders.
pythonpath = [".", "tests"]
